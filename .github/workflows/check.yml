# yds 전체 검사: main 에 올리거나 PR 을 열 때마다 돈다 (tools/check.mjs)
#   원본으로 토큰, 템플릿, 사이트를 다시 만들어 저장소와 같은지(--regen), 링크, 규칙, 마크다운, 싱크, 컴포넌트 9곳을 본다
name: yds 검사
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs --regen
