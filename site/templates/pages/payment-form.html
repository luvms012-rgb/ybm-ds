<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 폼 - YBM DS 템플릿</title>
<link rel="stylesheet" href="../../../dist/ybm-ds.css">
<script src="../../../dist/ybm-ds.js" defer></script>
<style>
  /* 템플릿 배치 전용. 값은 모두 --ybm-* 토큰 */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .tp-app { display: flex; flex-direction: column; min-height: 100vh; background: var(--ybm-color-bg-layer-default); }
  .tp-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--ybm-space-x4); padding: var(--ybm-space-x5) var(--ybm-space-x4); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-head__texts { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 0; }
  .tp-head__tools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--ybm-space-x2); }
  .tp-h1 { font-size: var(--ybm-font-size-t09); line-height: var(--ybm-line-height-t09); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; }
  .tp-h2 { font-size: var(--ybm-font-size-t07); line-height: var(--ybm-line-height-t07); font-weight: var(--ybm-font-weight-semibold); letter-spacing: -0.02em; }
  .tp-h3 { font-size: var(--ybm-font-size-t05); line-height: var(--ybm-line-height-t05); font-weight: var(--ybm-font-weight-semibold); }
  .tp-h4 { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); font-weight: var(--ybm-font-weight-semibold); }
  .tp-sub { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-caption { font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); color: var(--ybm-color-fg-neutral-subtle); }
  .tp-num { font-variant-numeric: tabular-nums; }
  .tp-body { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; }
  .tp-content { display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--ybm-space-x8); min-width: 0; padding: var(--ybm-space-x5) var(--ybm-space-x4) var(--ybm-space-x10); }
  .tp-panel { display: flex; flex-direction: column; gap: var(--ybm-space-x6); padding: var(--ybm-space-x5) var(--ybm-space-x4); box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-sec { display: flex; flex-direction: column; gap: var(--ybm-space-x3); min-width: 0; }
  .tp-sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2) var(--ybm-space-x3); }
  .tp-sec-head__texts { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ybm-space-x1) var(--ybm-space-x3); }
  .tp-row { display: flex; align-items: center; gap: var(--ybm-space-x2); min-width: 0; }
  .tp-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2); }
  .tp-stack { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 0; }
  .tp-g2, .tp-g3, .tp-g4, .tp-g5, .tp-g6 { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x3); }
  .tp-card { min-width: 0; }
  .tp-card.ds-card { gap: var(--ybm-space-x3); }
  .tp-span2 { grid-column: auto; }
  .tp-kpi__label { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-kpi__value { font-size: var(--ybm-font-size-t09); line-height: var(--ybm-line-height-t09); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tp-delta { display: inline-flex; align-items: center; gap: 2px; font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); font-weight: var(--ybm-font-weight-medium); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tp-delta .ds-icon { --ds-icon-size: 14px; }
  .tp-delta[data-tone="up"] { color: var(--ybm-color-fg-positive); }
  .tp-delta[data-tone="down"] { color: var(--ybm-color-fg-critical); }
  .tp-delta[data-tone="flat"] { color: var(--ybm-color-fg-neutral-muted); }
  .tp-chart { display: block; width: 100%; height: auto; overflow: visible; }
  .tp-chart text { fill: var(--ybm-color-fg-neutral-subtle); font-size: 11px; font-family: inherit; }
  .tp-chart .tp-grid-line { stroke: var(--ybm-color-stroke-neutral-muted); stroke-width: 1; }
  .tp-legend { display: flex; flex-wrap: wrap; gap: var(--ybm-space-x1) var(--ybm-space-x4); font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); color: var(--ybm-color-fg-neutral-muted); }
  .tp-legend__item { display: inline-flex; align-items: center; gap: var(--ybm-space-x1_5); }
  .tp-swatch { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--ybm-color-chart-series-1)); }
  .tp-split { display: flex; height: 12px; overflow: hidden; border-radius: var(--ybm-shape-pill); background: var(--ybm-color-bg-neutral); }
  .tp-split > span { height: 100%; background: var(--c); }
  .tp-split > span + span { box-shadow: inset 2px 0 0 var(--ybm-color-bg-layer-default); }
  .tp-ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--ybm-color-fg-neutral-subtle); background: var(--ybm-color-bg-neutral); }
  .tp-logo { display: inline-grid; place-items: center; width: 88px; height: 28px; border-radius: var(--ybm-shape-xs); background: var(--ybm-color-bg-neutral); color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t03-static); line-height: var(--ybm-line-height-t03-static); font-weight: var(--ybm-font-weight-semibold); }
  .tp-bar { position: sticky; top: 0; z-index: var(--ybm-z-sticky); background: var(--ybm-color-bg-layer-default); }
  .tp-track { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 120px; }
  .tp-hide-sm { display: none; }
  .tp-scroll-x { overflow-x: auto; }
  .tp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tp-kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: var(--ybm-shape-2xs); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-muted); color: var(--ybm-color-fg-neutral-muted); font-size: var(--ybm-font-size-t01); font-family: inherit; }
  @media (min-width: 768px) {
    .tp-head { padding: var(--ybm-space-x6); }
    .tp-content { padding: var(--ybm-space-x6) var(--ybm-space-x6) var(--ybm-space-x12); }
    .tp-panel { padding: var(--ybm-space-x6); }
    .tp-g2, .tp-g4, .tp-g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-g3, .tp-g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-hide-sm { display: revert; }
  }
  @media (min-width: 1024px) {
    .tp-body--panel { flex-direction: row; }
    .tp-body--panel > .tp-panel { flex: none; width: 400px; box-shadow: inset 1px 0 0 var(--ybm-color-stroke-neutral-muted); }
    .tp-g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tp-g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .tp-g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-span2 { grid-column: span 2; }
    .tp-span3 { grid-column: span 3; }
  }
  @media (min-width: 1280px) { .tp-g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

  .tp-form { display: flex; flex-direction: column; gap: var(--ybm-space-x5); }
  .tp-form .ds-field { min-width: 0; }
  .tp-pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x4); }
  @media (min-width: 560px) { .tp-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tp-legend-t { font-size: var(--ybm-font-size-t05); line-height: var(--ybm-line-height-t05); font-weight: var(--ybm-font-weight-semibold); }
  .tp-chips { display: flex; flex-wrap: wrap; gap: var(--ybm-space-x2); }
  .tp-optrow { display: flex; gap: var(--ybm-space-x3); align-items: flex-start; padding: var(--ybm-space-x3) 0; }
  .tp-optrow + .tp-optrow { box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-footer-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--ybm-space-x3); padding: var(--ybm-space-x4); box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); background: var(--ybm-color-bg-layer-default); }
  @media (min-width: 768px) { .tp-footer-bar { padding: var(--ybm-space-x4) var(--ybm-space-x6); } }
  .tp-sum-line { display: flex; justify-content: space-between; gap: var(--ybm-space-x3); font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); }
  .tp-sum-line > :first-child { color: var(--ybm-color-fg-neutral-muted); }
  .tp-sum-total { display: flex; justify-content: space-between; font-size: var(--ybm-font-size-t05); line-height: var(--ybm-line-height-t05); font-weight: var(--ybm-font-weight-bold); }
  .tp-item { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: var(--ybm-space-x3); align-items: start; }
  .tp-item .ds-imageframe { border-radius: var(--ybm-shape-sm); }

  .tp-pay { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x8); width: min(100%, 1080px); margin-inline: auto; }
  @media (min-width: 1024px) { .tp-pay { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; } .tp-pay__aside { position: sticky; top: var(--ybm-space-x6); } }
</style>
</head>
<body>
<div class="tp-app"><main class="tp-content">
  <div class="tp-pay">
    <div class="tp-form">
      <div class="tp-stack"><h1 class="tp-h1">결제 요청</h1><p class="tp-sub">주문 내용을 확인하고 결제를 끝내 주세요. 모든 결제는 암호화되어 안전하게 처리돼요.</p></div>
      <hr class="ds-divider">
      <section class="ds-card tp-card" data-size="small"><div class="tp-between"><span class="tp-h4">로그인하고 결제하기</span><button type="button" class="ds-btn" data-variant="neutralWeak" data-size="small">로그인</button></div><p class="tp-sub">로그인하면 주문을 추적하고 정보를 저장해 다음에 더 빨리 결제할 수 있어요.</p></section>
      <h2 class="tp-legend-t">연락처</h2>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-mail">이메일 <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-mail" placeholder="you@example.com" type="email"></div></div>
      <label class="ds-checkbox"><input type="checkbox" class="ds-checkbox__control"><span class="ds-checkbox__label">새 소식과 혜택을 이메일로 받기</span></label>
      <h2 class="tp-legend-t">배송 정보</h2>
      <div class="tp-pair"><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-name">받는 사람 <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-name" placeholder="홍길동" ></div></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-phone">휴대폰 번호</label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-phone" placeholder="010-0000-0000" type="tel"></div></div></div>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-addr">주소 <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-addr" placeholder="서울시 종로구 종로 104" ></div></div>
      <div class="tp-pair"><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-addr2">상세 주소</label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-addr2" placeholder="3층" ></div></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-zip">우편번호 <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-zip" placeholder="03190" ></div></div></div>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-req">배송 요청</label></div><button type="button" class="ds-select" data-size="medium" id="f-req" aria-haspopup="listbox" aria-expanded="false"><span class="ds-select__value">문 앞에 놓아 주세요</span></button></div>
      <label class="ds-checkbox"><input type="checkbox" class="ds-checkbox__control" checked><span class="ds-checkbox__label">다음에도 이 배송지 쓰기</span></label>
      <h2 class="tp-legend-t">결제 수단</h2>
      <div class="ds-radio-group" role="radiogroup" data-size="medium"><label class="ds-radio"><input type="radio" class="ds-radio__control" name="pay" checked><span>신용·체크 카드</span></label><label class="ds-radio"><input type="radio" class="ds-radio__control" name="pay"><span>간편 결제</span></label><label class="ds-radio"><input type="radio" class="ds-radio__control" name="pay"><span>계좌 이체</span></label></div>
      <div class="tp-pair"><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-card">카드 번호 <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-card" placeholder="0000 0000 0000 0000" inputmode="numeric"></div></div><div class="tp-pair"><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-exp">유효 기간 <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-exp" placeholder="MM/YY" ></div></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="f-cvc">CVC <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="f-cvc" placeholder="123" ></div></div></div></div>
      <label class="ds-checkbox"><input type="checkbox" class="ds-checkbox__control"><span class="ds-checkbox__label">주문 내용을 확인했고 결제에 동의해요</span></label>
    </div>
    <aside class="tp-pay__aside tp-stack" style="gap: var(--ybm-space-x4)">
      <section class="ds-card tp-card" data-size="small"><div class="tp-between"><h2 class="tp-h3">주문 요약</h2><span class="ds-badge" data-tone="neutral">3개</span></div><div class="tp-item"><div class="ds-imageframe" data-ratio="1:1" aria-hidden="true"><span class="tp-ph"><i class="ds-icon ds-icon--image" aria-hidden="true"></i></span></div><div class="tp-stack"><div class="tp-between" style="align-items:flex-start;flex-wrap:nowrap"><span>TOEIC 실전 모의고사 1000제</span><span class="tp-num">38,000원</span></div><span class="tp-caption">교재 · 2권 세트</span></div></div><div class="tp-item"><div class="ds-imageframe" data-ratio="1:1" aria-hidden="true"><span class="tp-ph"><i class="ds-icon ds-icon--image" aria-hidden="true"></i></span></div><div class="tp-stack"><div class="tp-between" style="align-items:flex-start;flex-wrap:nowrap"><span>단어 암기 카드</span><span class="tp-num">12,000원</span></div><span class="tp-caption">교구 · 1개</span></div></div><div class="tp-item"><div class="ds-imageframe" data-ratio="1:1" aria-hidden="true"><span class="tp-ph"><i class="ds-icon ds-icon--image" aria-hidden="true"></i></span></div><div class="tp-stack"><div class="tp-between" style="align-items:flex-start;flex-wrap:nowrap"><span>오답 노트 3권</span><span class="tp-num">9,000원</span></div><span class="tp-caption">문구 · 3개</span></div></div><hr class="ds-divider"><div class="tp-sum-line"><span>상품 금액</span><span class="tp-num">59,000원</span></div><div class="tp-sum-line"><span>배송비</span><span class="tp-num">3,000원</span></div><div class="tp-sum-line"><span>할인</span><span class="tp-num">-5,000원</span></div><hr class="ds-divider"><div class="tp-sum-total"><span>합계</span><span class="tp-num">57,000원</span></div></section>
      <button type="button" class="ds-btn" data-variant="brandSolid" data-size="large" data-width="fill">57,000원 결제하기</button>
      <p class="tp-caption" style="text-align:center"><i class="ds-icon ds-icon--lock ds-icon--sm" aria-hidden="true"></i> 결제 정보는 저장하지 않아요</p>
    </aside>
  </div>
</main></div>
</body>
</html>
