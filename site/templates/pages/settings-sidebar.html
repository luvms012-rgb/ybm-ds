<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설정 패널 - YBM DS 템플릿</title>
<link rel="stylesheet" href="../../../dist/ybm-ds.css">
<script src="../../../dist/ybm-ds.js" defer></script>
<style>
  /* 템플릿 배치 전용. 값은 모두 --ybm-* 토큰 */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .tp-app { display: flex; flex-direction: column; min-height: 100vh; background: var(--ybm-color-bg-layer-default); }
  .tp-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--ybm-space-x4); padding: var(--ybm-space-x5) var(--ybm-space-x4); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-head__texts { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 0; }
  .tp-head__tools { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--ybm-space-x2); }
  .tp-head > .tp-row, .tp-head .tp-between > .tp-row { flex-wrap: wrap; }
  .ds-tablepagination { flex-wrap: wrap; row-gap: var(--ybm-space-x2); }
  .tp-h1 { font-size: var(--ybm-font-size-t09); line-height: var(--ybm-line-height-t09); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; }
  .tp-h2 { font-size: var(--ybm-font-size-t07); line-height: var(--ybm-line-height-t07); font-weight: var(--ybm-font-weight-semibold); letter-spacing: -0.02em; }
  .tp-h3 { font-size: var(--ybm-font-size-t05); line-height: var(--ybm-line-height-t05); font-weight: var(--ybm-font-weight-semibold); }
  .tp-h4 { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); font-weight: var(--ybm-font-weight-semibold); }
  .tp-sub { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-caption { font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); color: var(--ybm-color-fg-neutral-subtle); }
  .tp-num { font-variant-numeric: tabular-nums; }
  .tp-body { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; }
  .tp-content { display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--ybm-space-x8); min-width: 0; padding: var(--ybm-space-x5) var(--ybm-space-x4) var(--ybm-space-x10); }
  .tp-panel { display: flex; flex-direction: column; gap: var(--ybm-space-x6); padding: var(--ybm-space-x5) var(--ybm-space-x4); box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-sec { display: flex; flex-direction: column; gap: var(--ybm-space-x3); min-width: 0; }
  .tp-sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2) var(--ybm-space-x3); }
  .tp-sec-head__texts { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ybm-space-x1) var(--ybm-space-x3); }
  .tp-row { display: flex; align-items: center; gap: var(--ybm-space-x2); min-width: 0; }
  .tp-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2); }
  .tp-stack { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 0; }
  .tp-g2, .tp-g3, .tp-g4, .tp-g5, .tp-g6 { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x3); }
  .tp-card { min-width: 0; }
  .tp-card.ds-card { gap: var(--ybm-space-x3); }
  .tp-span2 { grid-column: auto; }
  .tp-kpi__label { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-kpi__value { font-size: var(--ybm-font-size-t09); line-height: var(--ybm-line-height-t09); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tp-delta { display: inline-flex; align-items: center; gap: 2px; font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); font-weight: var(--ybm-font-weight-medium); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tp-delta .ds-icon { --ds-icon-size: 14px; }
  .tp-delta[data-tone="up"] { color: var(--ybm-color-fg-positive); }
  .tp-delta[data-tone="down"] { color: var(--ybm-color-fg-critical); }
  .tp-delta[data-tone="flat"] { color: var(--ybm-color-fg-neutral-muted); }
  .tp-chart { display: block; width: 100%; height: auto; overflow: visible; }
  .tp-chart text { fill: var(--ybm-color-fg-neutral-subtle); font-size: 11px; font-family: inherit; }
  .tp-chart .tp-grid-line { stroke: var(--ybm-color-stroke-neutral-muted); stroke-width: 1; }
  .tp-legend { display: flex; flex-wrap: wrap; gap: var(--ybm-space-x1) var(--ybm-space-x4); font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); color: var(--ybm-color-fg-neutral-muted); }
  .tp-legend__item { display: inline-flex; align-items: center; gap: var(--ybm-space-x1_5); }
  .tp-swatch { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--ybm-color-chart-series-1)); }
  .tp-split { display: flex; height: 12px; overflow: hidden; border-radius: var(--ybm-shape-pill); background: var(--ybm-color-bg-neutral); }
  .tp-split > span { height: 100%; background: var(--c); }
  .tp-split > span + span { box-shadow: inset 2px 0 0 var(--ybm-color-bg-layer-default); }
  .tp-ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--ybm-color-fg-neutral-subtle); background: var(--ybm-color-bg-neutral); }
  .tp-logo { display: inline-grid; place-items: center; width: 88px; height: 28px; border-radius: var(--ybm-shape-xs); background: var(--ybm-color-bg-neutral); color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t03-static); line-height: var(--ybm-line-height-t03-static); font-weight: var(--ybm-font-weight-semibold); }
  .tp-bar { position: sticky; top: 0; z-index: var(--ybm-z-sticky); background: var(--ybm-color-bg-layer-default); }
  .tp-track { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 120px; }
  .tp-hide-sm { display: none; }
  .tp-scroll-x { overflow-x: auto; }
  .tp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tp-kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: var(--ybm-shape-2xs); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-muted); color: var(--ybm-color-fg-neutral-muted); font-size: var(--ybm-font-size-t01); font-family: inherit; }
  @media (min-width: 768px) {
    .tp-head { padding: var(--ybm-space-x6); }
    .tp-content { padding: var(--ybm-space-x6) var(--ybm-space-x6) var(--ybm-space-x12); }
    .tp-panel { padding: var(--ybm-space-x6); }
    .tp-g2, .tp-g4, .tp-g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-g3, .tp-g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-hide-sm { display: revert; }
  }
  @media (min-width: 1024px) {
    .tp-body--panel { flex-direction: row; }
    .tp-body--panel > .tp-panel { flex: none; width: 400px; box-shadow: inset 1px 0 0 var(--ybm-color-stroke-neutral-muted); }
    .tp-g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tp-g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .tp-g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-span2 { grid-column: span 2; }
    .tp-span3 { grid-column: span 3; }
  }
  @media (min-width: 1280px) { .tp-g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

  .tp-snav { display: flex; flex-direction: column; gap: var(--ybm-space-x1); }
  .tp-snav__group { font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); color: var(--ybm-color-fg-neutral-subtle); padding: var(--ybm-space-x3) var(--ybm-space-x2) var(--ybm-space-x1); }
  .tp-snav__item { display: flex; align-items: center; gap: var(--ybm-space-x2); width: 100%; min-height: 36px; padding: 0 var(--ybm-space-x2); border: 0; border-radius: var(--ybm-shape-sm); background: none; color: var(--ybm-color-fg-neutral-muted); font: inherit; font-size: var(--ybm-font-size-t04); text-align: left; text-decoration: none; cursor: pointer; }
  .tp-snav__item:hover { background: var(--ybm-color-bg-transparent-pressed); }
  .tp-snav__item[aria-current="page"] { background: var(--ybm-color-bg-neutral); color: var(--ybm-color-fg-neutral); font-weight: var(--ybm-font-weight-semibold); }
  .tp-srow { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x3); padding-block: var(--ybm-space-x4); }
  .tp-srow + .tp-srow { box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  @media (min-width: 768px) { .tp-srow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; } }
  .tp-srow__label { display: flex; gap: var(--ybm-space-x3); align-items: flex-start; }
  .tp-srow__label > .ds-icon { margin-top: 2px; color: var(--ybm-color-fg-neutral-muted); }

  .tp-sp { display: grid; flex: 1 1 auto; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1024px) { .tp-sp { grid-template-columns: 280px minmax(0, 1fr); } }
  .tp-sp__side { display: flex; flex-direction: column; gap: var(--ybm-space-x3); padding: var(--ybm-space-x5) var(--ybm-space-x4); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  @media (min-width: 1024px) { .tp-sp__side { padding: var(--ybm-space-x8) var(--ybm-space-x5); box-shadow: inset -1px 0 0 var(--ybm-color-stroke-neutral-muted); } }
  .tp-sp__main { display: flex; flex-direction: column; gap: var(--ybm-space-x6); width: min(100%, 720px); padding: var(--ybm-space-x6) var(--ybm-space-x4) var(--ybm-space-x12); }
  @media (min-width: 1024px) { .tp-sp__main { padding: var(--ybm-space-x8) var(--ybm-space-x10); } }
  .tp-info { display: flex; justify-content: space-between; gap: var(--ybm-space-x4); padding-block: var(--ybm-space-x4); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-info__v { color: var(--ybm-color-fg-neutral-muted); font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); }
</style>
</head>
<body>
<div class="tp-app">
<div class="tp-sp">
  <aside class="tp-sp__side"><h2 class="tp-h2">계정 설정</h2><nav class="tp-snav" aria-label="설정 메뉴"><a class="tp-snav__item" href="#" aria-current="page"><i class="ds-icon ds-icon--user ds-icon--sm" aria-hidden="true"></i>개인 정보</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--lock ds-icon--sm" aria-hidden="true"></i>로그인과 보안</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--credit-card ds-icon--sm" aria-hidden="true"></i>결제와 환불</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--bell ds-icon--sm" aria-hidden="true"></i>알림</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--shield-check ds-icon--sm" aria-hidden="true"></i>개인정보 보호</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--book-open ds-icon--sm" aria-hidden="true"></i>학습 설정</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--globe ds-icon--sm" aria-hidden="true"></i>언어와 지역</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--smartphone ds-icon--sm" aria-hidden="true"></i>연결된 기기</a><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--building ds-icon--sm" aria-hidden="true"></i>기업 계정</a></nav><hr class="ds-divider"><nav class="tp-snav" aria-label="설정 메뉴"><a class="tp-snav__item" href="#"><i class="ds-icon ds-icon--log-out ds-icon--sm" aria-hidden="true"></i>로그아웃</a></nav></aside>
  <main class="tp-sp__main">
    <h1 class="tp-h1">개인 정보</h1>
    <div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">실명</span><span class="tp-info__v">김서윤</span></div><a class="ds-link" href="#">고치기</a></div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">부르는 이름</span><span class="tp-info__v">입력하지 않음</span></div><a class="ds-link" href="#">고치기</a></div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">이메일</span><span class="tp-info__v">s***n@example.com</span></div><a class="ds-link" href="#">고치기</a></div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">휴대폰</span><span class="tp-info__v">010-****-5678</span></div><a class="ds-link" href="#">고치기</a></div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">본인 인증</span><span class="tp-info__v"><span class="ds-badge" data-tone="positive">인증 완료</span></span></div></div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">집 주소</span><span class="tp-info__v">입력하지 않음</span></div><a class="ds-link" href="#">고치기</a></div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">우편 받을 주소</span><span class="tp-info__v">입력하지 않음</span></div><a class="ds-link" href="#">고치기</a></div><div class="tp-info"><div class="tp-stack"><span class="tp-h4">비상 연락처</span><span class="tp-info__v">입력함</span></div><a class="ds-link" href="#">고치기</a></div></div>
    <section class="ds-card tp-card" data-size="small"><div class="tp-row" style="align-items:flex-start"><i class="ds-icon ds-icon--info ds-icon--sm" aria-hidden="true"></i><div class="tp-stack"><span class="tp-h4">왜 어떤 정보는 여기 안 보이나요?</span><span class="tp-sub">본인 확인을 위해 일부 정보는 가려서 보여 드려요. 가린 정보는 고치기를 누른 뒤 본인 인증을 하면 볼 수 있어요.</span></div></div></section>
  </main>
</div>
</div>
</body>
</html>
