<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 - YBM DS 템플릿</title>
<link rel="stylesheet" href="../../../dist/ybm-ds.css">
<script src="../../../dist/ybm-ds.js" defer></script>
<style>
  /* 템플릿 배치 전용. 값은 모두 --ybm-* 토큰
     배치(여백, 카드, 구분선)는 레퍼런스 A 템플릿, 한글 글자 위계(크기, 굵기, 색 단계, 자간)는 토스를 따른다 */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .tp-app { display: flex; flex-direction: column; min-height: 100vh; background: var(--ybm-color-bg-layer-default); }
  .tp-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--ybm-space-x3) var(--ybm-space-x4); padding: var(--ybm-space-x6) var(--ybm-space-x4) 0; }
  .tp-head__texts { display: flex; flex-direction: column; gap: var(--ybm-space-x1_5); min-width: 0; }
  .tp-head__tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ybm-space-x2); }
  .tp-head > .tp-row, .tp-head .tp-between > .tp-row { flex-wrap: wrap; }
  .ds-tablepagination { flex-wrap: wrap; row-gap: var(--ybm-space-x2); min-width: 0; }
  .tp-between > .tp-row { flex-wrap: wrap; }
  /* 글자 위계 (토스): 굵기 두 단계, 제목은 자간 -0.02em, 글자 색은 neutral / muted / subtle 세 단계 */
  .tp-h1 { font-size: var(--ybm-font-size-t09); line-height: var(--ybm-line-height-t09); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; }
  .tp-h2 { font-size: var(--ybm-font-size-t06); line-height: var(--ybm-line-height-t06); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; }
  .tp-h3 { font-size: var(--ybm-font-size-t05); line-height: var(--ybm-line-height-t05); font-weight: var(--ybm-font-weight-semibold); letter-spacing: -0.01em; }
  .tp-h4 { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); font-weight: var(--ybm-font-weight-semibold); }
  .tp-sub { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-caption { font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); color: var(--ybm-color-fg-neutral-subtle); }
  .tp-num { font-variant-numeric: tabular-nums; }
  /* 표 (커뮤니티 게시판 기준, 토스증권 / 네이버 증권 / 당근 비즈니스 표와 같은 결):
     위 진한 선 하나, 머리줄은 바탕 없이 작은 muted 글자, 행 56 / 촘촘 48, 행 사이 옅은 선, 숫자 고정폭, 올리면 옅은 바탕 */
  .ds-table { --ds-table-head-h: 44px; --ds-table-row-h: 56px; font-variant-numeric: tabular-nums; }
  .ds-table[data-density="compact"] { --ds-table-head-h: 44px; --ds-table-row-h: 48px; }
  /* 선은 그림자 대신 테두리로 (줄에 그림자를 그리면 표 양 끝에 세로 선이 생긴다) */
  .ds-table tr, .ds-table thead tr { background: none; box-shadow: none; }
  .ds-table { border-top: 1px solid var(--ybm-color-stroke-neutral-solid); }
  .ds-table :is(th, td) { border-bottom: 1px solid var(--ybm-color-stroke-neutral-muted); }
  .ds-table thead th { font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); font-weight: var(--ybm-font-weight-regular); color: var(--ybm-color-fg-neutral-subtle); }
  .ds-table :is(th, td) { padding: var(--ybm-space-x2) var(--ybm-space-x3); }
  .ds-table :is(th, td):first-child { padding-inline-start: var(--ybm-space-x4); }
  .ds-table :is(th, td):last-child { padding-inline-end: var(--ybm-space-x4); }
  @media (hover: hover) { .ds-table tbody tr:not(.tp-grouprow):hover { background: var(--ybm-color-bg-neutral-weak-alpha); } }
  /* 체크박스만 든 칸: 잘리지 않게 폭 고정 */
  .ds-table :is(th, td):has(> .ds-checkbox:only-child) { width: 52px; padding-inline: var(--ybm-space-x4) var(--ybm-space-x2); overflow: visible; }
  .ds-table .ds-checkbox { vertical-align: middle; }
  .ds-table [data-align="end"] { text-align: end; }
  /* 두 줄 칸: 위 본문, 아래 작은 subtle */
  .tp-cell2 { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tp-cell2 > :first-child { overflow: hidden; text-overflow: ellipsis; color: var(--ybm-color-fg-neutral); }
  .tp-cell2 > :last-child:not(:first-child) { color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); }
  /* 묶음 행: 옅은 바탕 + 굵은 이름 (바탕은 tr 에, 선이 덮이지 않게) */
  .ds-table .tp-grouprow { height: 44px; background: var(--ybm-color-bg-neutral-weak-alpha); }
  .ds-table .tp-grouprow > td { padding-block: var(--ybm-space-x2); font-weight: var(--ybm-font-weight-semibold); color: var(--ybm-color-fg-neutral); }
  /* 표 위 한 줄: 왼쪽 개수, 오른쪽 고르기 칸과 찾기 (커뮤니티 게시판 btools) */
  .tp-ttools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x3); }
  .tp-ttools__end { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ybm-space-x2); }
  .tp-ttools__end > .ds-select { min-width: 120px; }
  .tp-ttools .ds-input { flex: none; width: 240px; max-width: 100%; }
  .tp-tfoot { display: flex; justify-content: center; padding-top: var(--ybm-space-x2); }
  /* 배치 (레퍼런스 A): 흰 바탕, 바깥 여백 16 / 24, 묶음 사이 24 / 32 와 구분선 */
  .tp-body { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; }
  .tp-content { display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--ybm-space-x6); min-width: 0; padding: var(--ybm-space-x5) var(--ybm-space-x4) var(--ybm-space-x10); }
  .tp-panel { display: flex; flex-direction: column; gap: var(--ybm-space-x5); padding: var(--ybm-space-x5) var(--ybm-space-x4); box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-sec { display: flex; flex-direction: column; gap: var(--ybm-space-x3); min-width: 0; }
  .tp-sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2) var(--ybm-space-x3); }
  .tp-sec-head__texts { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ybm-space-x1) var(--ybm-space-x2); }
  .tp-row { display: flex; align-items: center; gap: var(--ybm-space-x2); min-width: 0; }
  /* 줄 안에 놓인 고르기 칸은 글자만큼만 */
  :is(.tp-row, .tp-between, .tp-head__tools, .tp-sec-head, .tp-ttools__end) > .ds-select { width: auto; min-width: 140px; }
  /* 도구 줄의 medium 세그먼트는 버튼, 고르기 칸과 같은 40 높이로 */
  :is(.tp-row, .tp-head__tools, .tp-tool__bar) > .ds-segmented[data-size="medium"] { box-sizing: border-box; height: 40px; }
  .tp-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2); }
  .tp-stack { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 0; }
  .tp-stack > .ds-badge { align-self: flex-start; }
  .tp-g2, .tp-g3, .tp-g4, .tp-g5, .tp-g6 { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x3); }
  /* 카드 (레퍼런스 A): 흰 바탕 + 옅은 1px 선, 모서리 12 */
  .tp-card { min-width: 0; }
  .tp-card.ds-card { gap: var(--ybm-space-x3); padding: var(--ybm-space-x4); border-radius: var(--ybm-shape-lg); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-muted); }
  .tp-span2 { grid-column: auto; }
  .tp-kpi__label { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-kpi__value { font-size: var(--ybm-font-size-t08); line-height: var(--ybm-line-height-t08); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tp-delta { display: inline-flex; align-items: center; gap: 2px; font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); font-weight: var(--ybm-font-weight-medium); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tp-delta .ds-icon { --ds-icon-size: 14px; }
  .tp-delta[data-tone="up"] { color: var(--ybm-color-fg-positive); }
  .tp-delta[data-tone="down"] { color: var(--ybm-color-fg-critical); }
  .tp-delta[data-tone="flat"] { color: var(--ybm-color-fg-neutral-muted); }
  /* 차트: 얇은 선, 옅은 격자, 마우스를 올리면 세로 안내선과 값 풍선 */
  .tp-chart { display: block; width: 100%; height: auto; overflow: visible; }
  .tp-chart text { fill: var(--ybm-color-fg-neutral-subtle); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
  .tp-chart .tp-grid-line { stroke: var(--ybm-color-stroke-neutral-muted); stroke-width: 1; }
  .tp-chart [data-i] { transition: opacity var(--ybm-duration-fast) var(--ybm-easing-standard); }
  .tp-chart.is-hover [data-i]:not(.is-on) { opacity: .35; }
  .tp-chart .tp-guide { stroke: var(--ybm-color-fg-neutral-subtle); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .tp-chart .tp-dot { stroke: var(--ybm-color-bg-layer-default); stroke-width: 2; opacity: 0; pointer-events: none; }
  .tp-chart.is-hover .tp-guide, .tp-chart.is-hover .tp-dot { opacity: 1; }
  .tp-tip { position: fixed; z-index: var(--ybm-z-tooltip, 60); display: flex; flex-direction: column; gap: 2px; min-width: 96px; padding: var(--ybm-space-x2) var(--ybm-space-x2_5); border-radius: var(--ybm-shape-sm); background: var(--ybm-color-bg-neutral-solid); color: var(--ybm-color-fg-on-neutral-solid); box-shadow: var(--ybm-elevation-overlay); font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--ybm-duration-fast) var(--ybm-easing-standard), transform var(--ybm-duration-fast) var(--ybm-easing-standard); }
  .tp-tip.is-on { opacity: 1; transform: none; }
  .tp-tip__t { font-weight: var(--ybm-font-weight-semibold); opacity: .8; }
  .tp-tip__t:only-child { opacity: 1; }
  [data-tip] { transition: filter var(--ybm-duration-fast) var(--ybm-easing-standard); }
  [data-tip]:hover { filter: brightness(0.9); }
  .tp-tip__r { display: flex; align-items: center; gap: var(--ybm-space-x1_5); font-variant-numeric: tabular-nums; }
  .tp-tip__r b { margin-inline-start: auto; padding-inline-start: var(--ybm-space-x3); font-weight: var(--ybm-font-weight-semibold); }
  .tp-tip__r i { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .tp-legend { display: flex; flex-wrap: wrap; gap: var(--ybm-space-x1) var(--ybm-space-x4); font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); color: var(--ybm-color-fg-neutral-muted); }
  .tp-legend__item { display: inline-flex; align-items: center; gap: var(--ybm-space-x1_5); }
  .tp-swatch { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--ybm-color-chart-series-1)); }
  .tp-split { display: flex; height: 10px; overflow: hidden; border-radius: var(--ybm-shape-pill); background: var(--ybm-color-bg-neutral); }
  .tp-split > span { height: 100%; background: var(--c); }
  .tp-split > span + span { box-shadow: inset 2px 0 0 var(--ybm-color-bg-layer-default); }
  .tp-ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--ybm-color-fg-neutral-subtle); background: var(--ybm-color-bg-neutral); }
  .tp-ph > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tp-logo { display: inline-grid; place-items: center; width: 88px; height: 28px; border-radius: var(--ybm-shape-xs); background: var(--ybm-color-bg-neutral); color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t03-static); line-height: var(--ybm-line-height-t03-static); font-weight: var(--ybm-font-weight-semibold); }
  .tp-bar { position: sticky; top: 0; z-index: var(--ybm-z-sticky); background: var(--ybm-color-bg-layer-default); }
  .tp-track { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 120px; }
  .tp-hide-sm { display: none; }
  .tp-scroll-x { overflow-x: auto; }
  .tp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tp-kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: var(--ybm-shape-2xs); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-muted); color: var(--ybm-color-fg-neutral-muted); font-size: var(--ybm-font-size-t01); font-family: inherit; }
  @media (min-width: 768px) {
    .tp-head { padding: var(--ybm-space-x8) var(--ybm-space-x6) 0; }
    .tp-h1 { font-size: var(--ybm-font-size-t11); line-height: var(--ybm-line-height-t11); }
    .tp-h2 { font-size: var(--ybm-font-size-t07); line-height: var(--ybm-line-height-t07); }
    .tp-content { padding: var(--ybm-space-x6) var(--ybm-space-x6) var(--ybm-space-x12); gap: var(--ybm-space-x8); }
    .tp-panel { padding: var(--ybm-space-x6); }
    .tp-card.ds-card { padding: var(--ybm-space-x5); gap: var(--ybm-space-x4); }
    .tp-g2, .tp-g3, .tp-g4, .tp-g5, .tp-g6 { gap: var(--ybm-space-x4); }
    .tp-g2, .tp-g4, .tp-g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-g3, .tp-g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-hide-sm { display: revert; }
  }
  @media (min-width: 1024px) {
    .tp-body--panel { flex-direction: row; }
    .tp-body--panel > .tp-panel { flex: none; width: 360px; box-shadow: inset 1px 0 0 var(--ybm-color-stroke-neutral-muted); }
    .tp-g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tp-g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .tp-g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-span2 { grid-column: span 2; }
    .tp-span3 { grid-column: span 3; }
  }
  @media (min-width: 1280px) { .tp-g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

  /* 위 메뉴 화면 */
  .tp-topbar { position: sticky; top: 0; z-index: var(--ybm-z-sticky); background: var(--ybm-color-bg-layer-default); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-topbar > .ds-topnav { width: min(100%, 1200px); margin-inline: auto; background: none; }
  .tp-topbar .ds-topnav__menu { display: none; }
  @media (min-width: 768px) { .tp-topbar .ds-topnav__menu { display: flex; } }
  .tp-wrap { width: min(100%, 1200px); margin-inline: auto; }
  .tp-topbar ~ .tp-head, .tp-topbar ~ .tp-content { box-sizing: border-box; width: min(100%, 1280px); margin-inline: auto; }
  /* 옆 메뉴 화면 */
  .tp-app.tp-frame { flex-direction: row; min-height: 100vh; }
  .tp-frame .ds-sidenav__header { justify-content: flex-start; }
  .tp-frame > .ds-sidenav { display: none; }
  .tp-frame__main { display: flex; flex: 1 1 auto; flex-direction: column; min-width: 0; }
  .tp-mbar { display: flex; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2); padding: var(--ybm-space-x2) var(--ybm-space-x4); background: var(--ybm-color-bg-layer-default); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  @media (min-width: 1024px) {
    .tp-frame > .ds-sidenav { display: flex; position: sticky; top: 0; flex: none; height: 100vh; background: var(--ybm-color-bg-layer-default); box-shadow: inset -1px 0 0 var(--ybm-color-stroke-neutral-muted); }
    .tp-mbar { display: none; }
  }
  .tp-org { display: flex; align-items: center; gap: var(--ybm-space-x2); padding: var(--ybm-space-x2) var(--ybm-space-x2) var(--ybm-space-x1); }
  .tp-org__mark { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: var(--ybm-shape-sm); background: var(--ybm-color-bg-neutral-solid); color: var(--ybm-color-fg-neutral-inverted); font-size: var(--ybm-font-size-t03-static); font-weight: var(--ybm-font-weight-bold); }
  /* 고르기 상자 칸 수: 모바일은 1칸(4칸은 2칸), 768 부터 지정한 칸 */
  .tp-sb2, .tp-sb3 { --ds-selectbox-columns: 1; } .tp-sb4 { --ds-selectbox-columns: 2; }
  @media (min-width: 768px) { .tp-sb2 { --ds-selectbox-columns: 2; } .tp-sb3 { --ds-selectbox-columns: 3; } .tp-sb4 { --ds-selectbox-columns: 4; } }
  /* 옆으로 미는 표는 눌리지 않게 */
  .tp-scroll-x .ds-table { min-width: 760px; }
  /* 공통 조각 */
  .tp-big { font-size: var(--ybm-font-size-t11); line-height: var(--ybm-line-height-t11); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tp-mid { font-size: var(--ybm-font-size-t07); line-height: var(--ybm-line-height-t07); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tp-rows { display: flex; flex-direction: column; }
  .tp-rows > * { padding-block: var(--ybm-space-x3); }
  .tp-rows > * + * { box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-kv { display: flex; justify-content: space-between; gap: var(--ybm-space-x3); font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); }
  .tp-kv > :first-child { color: var(--ybm-color-fg-neutral-muted); flex: none; }
  .tp-kv > :last-child { text-align: end; }
  .tp-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ybm-space-x4); }
  .tp-stats > * { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 0; }
  @media (min-width: 768px) { .tp-stats { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); } .tp-stats > * + * { padding-inline-start: var(--ybm-space-x4); box-shadow: inset 1px 0 0 var(--ybm-color-stroke-neutral-muted); } }
  .tp-thumb-sm { flex: none; width: 96px; }
  .tp-thumb-sm .ds-imageframe, .tp-course .ds-imageframe { border-radius: var(--ybm-shape-lg); }
  .tp-aside-sticky { display: flex; flex-direction: column; gap: var(--ybm-space-x3); }
  @media (min-width: 1024px) { .tp-aside-sticky { position: sticky; top: calc(var(--ybm-space-x16) + var(--ybm-space-x4)); } }

  /* 커뮤니티 배치: 모바일 1열, 1024 부터 게시판 메뉴 220 | 본문, 1280 부터 오른쪽 칸 300 */
  .tp-cm { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x6); box-sizing: border-box; width: min(100%, 1280px); margin-inline: auto; padding: var(--ybm-space-x5) var(--ybm-space-x4) var(--ybm-space-x12); }
  .tp-cm__main { display: flex; flex-direction: column; gap: var(--ybm-space-x6); min-width: 0; }
  .tp-cm__nav, .tp-cm__aside { display: none; }
  .tp-cm__chips { overflow-x: auto; scrollbar-width: none; }
  @media (min-width: 768px) { .tp-cm { padding: var(--ybm-space-x8) var(--ybm-space-x6) var(--ybm-space-x16); } }
  @media (min-width: 1024px) {
    .tp-cm:not(.tp-cm--one) { grid-template-columns: 220px minmax(0, 1fr); gap: var(--ybm-space-x8); }
    .tp-cm__nav { display: flex; flex-direction: column; gap: var(--ybm-space-x4); position: sticky; top: calc(var(--ybm-space-x16) + var(--ybm-space-x4)); align-self: start; }
    .tp-cm__chips { display: none; }
  }
  @media (min-width: 1280px) {
    .tp-cm--aside { grid-template-columns: 220px minmax(0, 1fr) 300px; }
    .tp-cm__aside { display: flex; flex-direction: column; gap: var(--ybm-space-x6); position: sticky; top: calc(var(--ybm-space-x16) + var(--ybm-space-x4)); align-self: start; }
  }
  /* 게시판 메뉴: 옆 메뉴 부품을 칸 폭에 맞춰 쓴다 */
  .tp-cm__nav .ds-sidenav { width: auto; height: auto; background: none; }
  .tp-cm__nav .ds-sidenav__content { padding: 0; }
  .tp-me { display: flex; flex-direction: column; gap: var(--ybm-space-x3); }
  /* 글 묶음: 줄 사이 선 */
  .tp-feed { display: flex; flex-direction: column; }
  .tp-feed > * { padding-block: var(--ybm-space-x5); }
  .tp-feed > * + * { box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-post { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x3); color: inherit; text-decoration: none; }
  .tp-post--thumb { grid-template-columns: minmax(0, 1fr) 88px; }
  @media (min-width: 768px) { .tp-post--thumb { grid-template-columns: minmax(0, 1fr) 120px; } }
  .tp-post__body { display: flex; flex-direction: column; gap: var(--ybm-space-x2); min-width: 0; }
  .tp-post__thumb .ds-imageframe { border-radius: var(--ybm-shape-lg); }
  .tp-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tp-who { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ybm-space-x1) var(--ybm-space-x2); min-width: 0; }
  .tp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ybm-space-x1) var(--ybm-space-x3); font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); color: var(--ybm-color-fg-neutral-subtle); font-variant-numeric: tabular-nums; }
  .tp-meta > span { display: inline-flex; align-items: center; gap: var(--ybm-space-x1); }
  .tp-meta .ds-icon { --ds-icon-size: 14px; }
  .tp-cnt { margin-inline-start: var(--ybm-space-x1); color: var(--ybm-color-fg-brand); font-weight: var(--ybm-font-weight-semibold); font-variant-numeric: tabular-nums; }
  /* 순위 목록 */
  .tp-rank { display: flex; flex-direction: column; gap: var(--ybm-space-x3); margin: 0; padding: 0; list-style: none; counter-reset: rank; }
  .tp-rank > li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: var(--ybm-space-x2); counter-increment: rank; }
  .tp-rank > li::before { content: counter(rank); font-weight: var(--ybm-font-weight-bold); font-variant-numeric: tabular-nums; color: var(--ybm-color-fg-neutral); }
  .tp-rank a { color: inherit; text-decoration: none; }
  .tp-hot { display: flex; flex-direction: column; gap: var(--ybm-space-x3); color: inherit; text-decoration: none; }
  .tp-hot .ds-imageframe { border-radius: var(--ybm-shape-lg); }

  .tp-cm--one { max-width: 800px; }
  .tp-wform { display: flex; flex-direction: column; gap: var(--ybm-space-x6); }
  .tp-wpick { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x4); }
  @media (min-width: 768px) { .tp-wpick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* 본문 칸: 도구 줄 + 글 칸을 한 상자로. 선은 상자와 도구 줄 자신에 그린다 */
  .tp-editor { display: flex; flex-direction: column; border-radius: var(--ybm-shape-lg); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-weak); }
  .tp-editor__bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ybm-space-x1); padding: var(--ybm-space-x2); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-editor .ds-textarea { --ds-textarea-line-width: 0px; --ds-textarea-min-height: 320px; background: none; }
  .tp-opts { display: flex; flex-direction: column; }
  .tp-opts > label { display: flex; align-items: center; justify-content: space-between; gap: var(--ybm-space-x3); padding-block: var(--ybm-space-x3); }
  .tp-opts > label + label { box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-wbar { position: sticky; bottom: 0; z-index: var(--ybm-z-sticky); display: flex; justify-content: flex-end; gap: var(--ybm-space-x2); padding: var(--ybm-space-x3) var(--ybm-space-x4); background: var(--ybm-color-bg-layer-default); box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-wbar__in { display: flex; justify-content: space-between; align-items: center; gap: var(--ybm-space-x2); width: min(100%, 752px); margin-inline: auto; }
</style>
</head>
<body>
<div class="tp-app"><div class="tp-topbar"><header class="ds-topnav">
  <div class="ds-topnav__left"><a class="ds-topnav__heading" href="#" aria-label="서비스 이름 홈"><span class="tp-logo">로고</span></a><nav class="ds-topnav__menu" aria-label="주요 메뉴"><a class="ds-topnav__item" href="#">홈</a><a class="ds-topnav__item" href="#" aria-current="page">게시판</a><a class="ds-topnav__item" href="#">인기글</a><a class="ds-topnav__item" href="#">모임</a></nav></div>
  <div class="ds-topnav__end"><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="찾기"><i class="ds-icon ds-icon--search" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="알림"><i class="ds-icon ds-icon--bell" aria-hidden="true"></i></button><span class="ds-avatar" data-size="28" role="img" aria-label="주말산책"><span class="ds-avatar__initials" aria-hidden="true">주</span></span></div>
</header></div>
<main class="tp-cm tp-cm--one">
  <div class="tp-cm__main">
    <header class="tp-stack" style="gap: var(--ybm-space-x1_5)"><h1 class="tp-h1">글쓰기</h1><p class="tp-sub">사진은 10장까지 올릴 수 있어요.</p></header>
    <form class="tp-wform" onsubmit="return false">
      <div class="tp-wpick"><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="w-board">게시판 <span class="ds-field__required" aria-hidden="true">*</span></label></div><button type="button" class="ds-select" data-size="medium" id="w-board" aria-haspopup="listbox" aria-expanded="false"><span class="ds-select__value">자유게시판</span></button></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="w-cat">말머리</label></div><button type="button" class="ds-select" data-size="medium" id="w-cat" aria-haspopup="listbox" aria-expanded="false"><span class="ds-select__value">잡담</span></button></div></div>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="w-title">제목 <span class="ds-field__required" aria-hidden="true">*</span></label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="w-title" placeholder="제목을 적어 주세요" maxlength="60"></div><div class="ds-field__footer"><p class="ds-field__help">60자까지 쓸 수 있어요.</p></div></div>
      <div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="w-body">본문 <span class="ds-field__required" aria-hidden="true">*</span></label></div>
        <div class="tp-editor"><div class="tp-editor__bar" role="toolbar" aria-label="글 꾸미기"><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="기울이기"><i class="ds-icon ds-icon--italic" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="링크 넣기"><i class="ds-icon ds-icon--link" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="목록"><i class="ds-icon ds-icon--list" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="사진 넣기"><i class="ds-icon ds-icon--image" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="파일 붙이기"><i class="ds-icon ds-icon--paperclip" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="투표 넣기"><i class="ds-icon ds-icon--chart-column" aria-hidden="true"></i></button></div><textarea class="ds-textarea" id="w-body" placeholder="이야기를 나눠 주세요. 다른 멤버를 존중하는 글을 써 주세요."></textarea></div>
      </div>
      <div class="ds-field"><div class="ds-field__header"><span class="ds-field__label">사진</span></div>
        <div class="ds-fileattach"><div class="ds-fileattach__items"><label class="ds-fileattach__trigger"><input type="file" class="ds-fileattach__input" multiple accept="image/*" aria-label="사진 추가"><i class="ds-icon ds-icon--plus" aria-hidden="true"></i><span class="ds-fileattach__count"><b>3</b>/10</span></label><div class="ds-fileitem" data-type="image"><img class="ds-fileitem__image" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=240&q=70" alt="산 사진"><span class="ds-fileitem__badge">대표</span><button type="button" class="ds-fileitem__remove" aria-label="산 사진 빼기"><i class="ds-icon ds-icon--x" aria-hidden="true"></i></button></div><div class="ds-fileitem" data-type="image"><img class="ds-fileitem__image" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=240&q=70" alt="바다 사진"><button type="button" class="ds-fileitem__remove" aria-label="바다 사진 빼기"><i class="ds-icon ds-icon--x" aria-hidden="true"></i></button></div><div class="ds-fileitem" data-type="image"><img class="ds-fileitem__image" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=240&q=70" alt="공원 사진"><button type="button" class="ds-fileitem__remove" aria-label="공원 사진 빼기"><i class="ds-icon ds-icon--x" aria-hidden="true"></i></button></div></div></div>
      </div>
      <div class="tp-opts">
        <label><span class="tp-stack"><span class="tp-h4">댓글 허용</span><span class="tp-caption">끄면 아무도 댓글을 달 수 없어요.</span></span><label class="ds-switch"><input type="checkbox" role="switch" class="ds-switch__control" aria-label="댓글 허용" checked></label></label>
        <label><span class="tp-stack"><span class="tp-h4">이름 숨기기</span><span class="tp-caption">글쓴이 이름 대신 익명으로 보여요.</span></span><label class="ds-switch"><input type="checkbox" role="switch" class="ds-switch__control" aria-label="이름 숨기기"></label></label>
      </div>
      <div class="ds-callout" data-tone="informative"><i class="ds-icon ds-icon--info-solid" aria-hidden="true"></i><div class="ds-callout__body"><p class="ds-callout__desc">광고, 욕설, 다른 사람의 개인 정보가 담긴 글은 알림 없이 숨겨질 수 있어요.</p></div></div>
    </form>
  </div>
</main>
<div class="tp-wbar"><div class="tp-wbar__in"><span class="tp-caption">자동 저장 14:32</span><div class="tp-row"><button type="button" class="ds-btn" data-variant="neutralWeak" data-size="medium">임시 저장</button><button type="button" class="ds-btn" data-variant="brandSolid" data-size="medium">등록</button></div></div></div>
</div>
</body>
</html>
