<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지 편집기 - YBM DS 템플릿</title>
<link rel="stylesheet" href="../../../dist/ybm-ds.css">
<script src="../../../dist/ybm-ds.js" defer></script>
<style>
  /* 템플릿 배치 전용. 값은 모두 --ybm-* 토큰
     배치(여백, 카드, 구분선)는 레퍼런스 A 템플릿, 한글 글자 위계(크기, 굵기, 색 단계, 자간)는 토스를 따른다 */
  body { word-break: keep-all; overflow-wrap: break-word; }
  .tp-app { display: flex; flex-direction: column; min-height: 100vh; background: var(--ybm-color-bg-layer-default); }
  .tp-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--ybm-space-x3) var(--ybm-space-x4); padding: var(--ybm-space-x6) var(--ybm-space-x4) 0; }
  .tp-head__texts { display: flex; flex-direction: column; gap: var(--ybm-space-x1_5); min-width: 0; }
  .tp-head__tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ybm-space-x2); }
  .tp-head > .tp-row, .tp-head .tp-between > .tp-row { flex-wrap: wrap; }
  .ds-tablepagination { flex-wrap: wrap; row-gap: var(--ybm-space-x2); min-width: 0; }
  .tp-between > .tp-row { flex-wrap: wrap; }
  /* 글자 위계 (토스): 굵기 두 단계, 제목은 자간 -0.02em, 글자 색은 neutral / muted / subtle 세 단계 */
  .tp-h1 { font-size: var(--ybm-font-size-t09); line-height: var(--ybm-line-height-t09); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; }
  .tp-h2 { font-size: var(--ybm-font-size-t06); line-height: var(--ybm-line-height-t06); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; }
  .tp-h3 { font-size: var(--ybm-font-size-t05); line-height: var(--ybm-line-height-t05); font-weight: var(--ybm-font-weight-semibold); letter-spacing: -0.01em; }
  .tp-h4 { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); font-weight: var(--ybm-font-weight-semibold); }
  .tp-sub { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-caption { font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); color: var(--ybm-color-fg-neutral-subtle); }
  .tp-num { font-variant-numeric: tabular-nums; }
  /* 표 (커뮤니티 게시판 기준, 토스증권 / 네이버 증권 / 당근 비즈니스 표와 같은 결):
     위 진한 선 하나, 머리줄은 바탕 없이 작은 muted 글자, 행 56 / 촘촘 48, 행 사이 옅은 선, 숫자 고정폭, 올리면 옅은 바탕 */
  .ds-table { --ds-table-head-h: 44px; --ds-table-row-h: 56px; font-variant-numeric: tabular-nums; }
  .ds-table[data-density="compact"] { --ds-table-head-h: 44px; --ds-table-row-h: 48px; }
  /* 선은 그림자 대신 테두리로 (줄에 그림자를 그리면 표 양 끝에 세로 선이 생긴다) */
  .ds-table tr, .ds-table thead tr { background: none; box-shadow: none; }
  .ds-table { border-top: 1px solid var(--ybm-color-stroke-neutral-solid); }
  .ds-table :is(th, td) { border-bottom: 1px solid var(--ybm-color-stroke-neutral-muted); }
  .ds-table thead th { font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); font-weight: var(--ybm-font-weight-regular); color: var(--ybm-color-fg-neutral-subtle); }
  .ds-table :is(th, td) { padding: var(--ybm-space-x2) var(--ybm-space-x3); }
  .ds-table :is(th, td):first-child { padding-inline-start: var(--ybm-space-x4); }
  .ds-table :is(th, td):last-child { padding-inline-end: var(--ybm-space-x4); }
  @media (hover: hover) { .ds-table tbody tr:not(.tp-grouprow):hover { background: var(--ybm-color-bg-neutral-weak-alpha); } }
  /* 체크박스만 든 칸: 잘리지 않게 폭 고정 */
  .ds-table :is(th, td):has(> .ds-checkbox:only-child) { width: 52px; padding-inline: var(--ybm-space-x4) var(--ybm-space-x2); overflow: visible; }
  .ds-table .ds-checkbox { vertical-align: middle; }
  .ds-table [data-align="end"] { text-align: end; }
  /* 두 줄 칸: 위 본문, 아래 작은 subtle */
  .tp-cell2 { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tp-cell2 > :first-child { overflow: hidden; text-overflow: ellipsis; color: var(--ybm-color-fg-neutral); }
  .tp-cell2 > :last-child:not(:first-child) { color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); }
  /* 묶음 행: 옅은 바탕 + 굵은 이름 (바탕은 tr 에, 선이 덮이지 않게) */
  .ds-table .tp-grouprow { height: 44px; background: var(--ybm-color-bg-neutral-weak-alpha); }
  .ds-table .tp-grouprow > td { padding-block: var(--ybm-space-x2); font-weight: var(--ybm-font-weight-semibold); color: var(--ybm-color-fg-neutral); }
  /* 표 위 한 줄: 왼쪽 개수, 오른쪽 고르기 칸과 찾기 (커뮤니티 게시판 btools) */
  .tp-ttools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x3); }
  .tp-ttools__end { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ybm-space-x2); }
  .tp-ttools__end > .ds-select { min-width: 120px; }
  .tp-ttools .ds-input { flex: none; width: 240px; max-width: 100%; }
  .tp-tfoot { display: flex; justify-content: center; padding-top: var(--ybm-space-x2); }
  /* 배치 (레퍼런스 A): 흰 바탕, 바깥 여백 16 / 24, 묶음 사이 24 / 32 와 구분선 */
  .tp-body { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; }
  .tp-content { display: flex; flex: 1 1 auto; flex-direction: column; gap: var(--ybm-space-x6); min-width: 0; padding: var(--ybm-space-x5) var(--ybm-space-x4) var(--ybm-space-x10); }
  .tp-panel { display: flex; flex-direction: column; gap: var(--ybm-space-x5); padding: var(--ybm-space-x5) var(--ybm-space-x4); box-shadow: inset 0 1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-sec { display: flex; flex-direction: column; gap: var(--ybm-space-x3); min-width: 0; }
  .tp-sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2) var(--ybm-space-x3); }
  .tp-sec-head__texts { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--ybm-space-x1) var(--ybm-space-x2); }
  .tp-row { display: flex; align-items: center; gap: var(--ybm-space-x2); min-width: 0; }
  /* 줄 안에 놓인 고르기 칸은 글자만큼만 */
  :is(.tp-row, .tp-between, .tp-head__tools, .tp-sec-head, .tp-ttools__end) > .ds-select { width: auto; min-width: 140px; }
  /* 도구 줄의 medium 세그먼트는 버튼, 고르기 칸과 같은 40 높이로 */
  :is(.tp-row, .tp-head__tools, .tp-tool__bar) > .ds-segmented[data-size="medium"] { box-sizing: border-box; height: 40px; }
  .tp-between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--ybm-space-x2); }
  .tp-stack { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 0; }
  .tp-stack > .ds-badge { align-self: flex-start; }
  .tp-g2, .tp-g3, .tp-g4, .tp-g5, .tp-g6 { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--ybm-space-x3); }
  /* 카드 (레퍼런스 A): 흰 바탕 + 옅은 1px 선, 모서리 12 */
  .tp-card { min-width: 0; }
  .tp-card.ds-card { gap: var(--ybm-space-x3); padding: var(--ybm-space-x4); border-radius: var(--ybm-shape-lg); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-muted); }
  .tp-span2 { grid-column: auto; }
  .tp-kpi__label { font-size: var(--ybm-font-size-t04); line-height: var(--ybm-line-height-t04); color: var(--ybm-color-fg-neutral-muted); }
  .tp-kpi__value { font-size: var(--ybm-font-size-t08); line-height: var(--ybm-line-height-t08); font-weight: var(--ybm-font-weight-bold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .tp-delta { display: inline-flex; align-items: center; gap: 2px; font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); font-weight: var(--ybm-font-weight-medium); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tp-delta .ds-icon { --ds-icon-size: 14px; }
  .tp-delta[data-tone="up"] { color: var(--ybm-color-fg-positive); }
  .tp-delta[data-tone="down"] { color: var(--ybm-color-fg-critical); }
  .tp-delta[data-tone="flat"] { color: var(--ybm-color-fg-neutral-muted); }
  /* 차트: 얇은 선, 옅은 격자, 마우스를 올리면 세로 안내선과 값 풍선 */
  .tp-chart { display: block; width: 100%; height: auto; overflow: visible; }
  .tp-chart text { fill: var(--ybm-color-fg-neutral-subtle); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
  .tp-chart .tp-grid-line { stroke: var(--ybm-color-stroke-neutral-muted); stroke-width: 1; }
  .tp-chart [data-i] { transition: opacity var(--ybm-duration-fast) var(--ybm-easing-standard); }
  .tp-chart.is-hover [data-i]:not(.is-on) { opacity: .35; }
  .tp-chart .tp-guide { stroke: var(--ybm-color-fg-neutral-subtle); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
  .tp-chart .tp-dot { stroke: var(--ybm-color-bg-layer-default); stroke-width: 2; opacity: 0; pointer-events: none; }
  .tp-chart.is-hover .tp-guide, .tp-chart.is-hover .tp-dot { opacity: 1; }
  .tp-tip { position: fixed; z-index: var(--ybm-z-tooltip, 60); display: flex; flex-direction: column; gap: 2px; min-width: 96px; padding: var(--ybm-space-x2) var(--ybm-space-x2_5); border-radius: var(--ybm-shape-sm); background: var(--ybm-color-bg-neutral-solid); color: var(--ybm-color-fg-on-neutral-solid); box-shadow: var(--ybm-elevation-overlay); font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity var(--ybm-duration-fast) var(--ybm-easing-standard), transform var(--ybm-duration-fast) var(--ybm-easing-standard); }
  .tp-tip.is-on { opacity: 1; transform: none; }
  .tp-tip__t { font-weight: var(--ybm-font-weight-semibold); opacity: .8; }
  .tp-tip__t:only-child { opacity: 1; }
  [data-tip] { transition: filter var(--ybm-duration-fast) var(--ybm-easing-standard); }
  [data-tip]:hover { filter: brightness(0.9); }
  .tp-tip__r { display: flex; align-items: center; gap: var(--ybm-space-x1_5); font-variant-numeric: tabular-nums; }
  .tp-tip__r b { margin-inline-start: auto; padding-inline-start: var(--ybm-space-x3); font-weight: var(--ybm-font-weight-semibold); }
  .tp-tip__r i { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .tp-legend { display: flex; flex-wrap: wrap; gap: var(--ybm-space-x1) var(--ybm-space-x4); font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); color: var(--ybm-color-fg-neutral-muted); }
  .tp-legend__item { display: inline-flex; align-items: center; gap: var(--ybm-space-x1_5); }
  .tp-swatch { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--ybm-color-chart-series-1)); }
  .tp-split { display: flex; height: 10px; overflow: hidden; border-radius: var(--ybm-shape-pill); background: var(--ybm-color-bg-neutral); }
  .tp-split > span { height: 100%; background: var(--c); }
  .tp-split > span + span { box-shadow: inset 2px 0 0 var(--ybm-color-bg-layer-default); }
  .tp-ph { display: grid; place-items: center; width: 100%; height: 100%; color: var(--ybm-color-fg-neutral-subtle); background: var(--ybm-color-bg-neutral); }
  .tp-ph > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tp-logo { display: inline-grid; place-items: center; width: 88px; height: 28px; border-radius: var(--ybm-shape-xs); background: var(--ybm-color-bg-neutral); color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t03-static); line-height: var(--ybm-line-height-t03-static); font-weight: var(--ybm-font-weight-semibold); }
  .tp-bar { position: sticky; top: 0; z-index: var(--ybm-z-sticky); background: var(--ybm-color-bg-layer-default); }
  .tp-track { display: flex; flex-direction: column; gap: var(--ybm-space-x1); min-width: 120px; }
  .tp-hide-sm { display: none; }
  .tp-scroll-x { overflow-x: auto; }
  .tp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .tp-kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: var(--ybm-shape-2xs); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-muted); color: var(--ybm-color-fg-neutral-muted); font-size: var(--ybm-font-size-t01); font-family: inherit; }
  @media (min-width: 768px) {
    .tp-head { padding: var(--ybm-space-x8) var(--ybm-space-x6) 0; }
    .tp-h1 { font-size: var(--ybm-font-size-t11); line-height: var(--ybm-line-height-t11); }
    .tp-h2 { font-size: var(--ybm-font-size-t07); line-height: var(--ybm-line-height-t07); }
    .tp-content { padding: var(--ybm-space-x6) var(--ybm-space-x6) var(--ybm-space-x12); gap: var(--ybm-space-x8); }
    .tp-panel { padding: var(--ybm-space-x6); }
    .tp-card.ds-card { padding: var(--ybm-space-x5); gap: var(--ybm-space-x4); }
    .tp-g2, .tp-g3, .tp-g4, .tp-g5, .tp-g6 { gap: var(--ybm-space-x4); }
    .tp-g2, .tp-g4, .tp-g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-g3, .tp-g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tp-hide-sm { display: revert; }
  }
  @media (min-width: 1024px) {
    .tp-body--panel { flex-direction: row; }
    .tp-body--panel > .tp-panel { flex: none; width: 360px; box-shadow: inset 1px 0 0 var(--ybm-color-stroke-neutral-muted); }
    .tp-g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .tp-g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .tp-g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tp-span2 { grid-column: span 2; }
    .tp-span3 { grid-column: span 3; }
  }
  @media (min-width: 1280px) { .tp-g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

  .tp-tool { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--ybm-color-bg-layer-default); }
  .tp-tool__bar { display: flex; align-items: center; gap: var(--ybm-space-x2); min-height: 52px; padding: var(--ybm-space-x2) var(--ybm-space-x3); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); overflow-x: auto; }
  .tp-tool__bar .tp-spacer { flex: 1 1 auto; }
  .tp-tool__body { display: flex; flex: 1 1 auto; min-height: 0; }
  .tp-pane { display: flex; flex-direction: column; gap: var(--ybm-space-x3); min-width: 0; overflow: auto; padding: var(--ybm-space-x3); }
  .tp-pane--left { display: none; flex: none; width: 260px; box-shadow: inset -1px 0 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-pane--right { display: none; flex: none; width: 280px; box-shadow: inset 1px 0 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-pane--main { flex: 1 1 auto; padding: 0; }
  @media (min-width: 768px) { .tp-pane--left { display: flex; } }
  @media (min-width: 1024px) { .tp-pane--right { display: flex; } }
  .tp-tree { list-style: none; margin: 0; padding: 0; font-size: var(--ybm-font-size-t03); line-height: var(--ybm-line-height-t03); }
  .tp-tree li > span { display: flex; align-items: center; gap: var(--ybm-space-x1_5); min-height: 28px; padding: 0 var(--ybm-space-x2) 0 calc(var(--ybm-space-x2) + var(--d, 0) * 16px); border-radius: var(--ybm-shape-xs); color: var(--ybm-color-fg-neutral-muted); cursor: default; }
  .tp-tree li > span[aria-selected="true"] { background: var(--ybm-color-bg-brand-weak); color: var(--ybm-color-fg-brand); }
  .tp-tree .ds-icon { --ds-icon-size: 16px; flex: none; }
  .tp-tree .tp-tw { width: 16px; display: inline-grid; place-items: center; }
  .tp-label { font-size: var(--ybm-font-size-t02); line-height: var(--ybm-line-height-t02); font-weight: var(--ybm-font-weight-semibold); color: var(--ybm-color-fg-neutral-subtle); text-transform: uppercase; letter-spacing: .02em; }
  .tp-insp { display: flex; flex-direction: column; gap: var(--ybm-space-x2); padding-block: var(--ybm-space-x3); box-shadow: inset 0 -1px 0 var(--ybm-color-stroke-neutral-muted); }
  .tp-insp__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ybm-space-x2); }
  .tp-mini { display: flex; align-items: center; gap: var(--ybm-space-x1); }
  .tp-mini > span { width: 20px; flex: none; color: var(--ybm-color-fg-neutral-subtle); font-size: var(--ybm-font-size-t02); text-align: center; }
  .tp-mini .ds-input { flex: 1 1 auto; min-width: 0; }

  .tp-pane--left { width: 300px; }
  .tp-blocks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ybm-space-x2); }
  .tp-blocks li { display: flex; align-items: center; gap: var(--ybm-space-x2); padding: var(--ybm-space-x2) var(--ybm-space-x3); border-radius: var(--ybm-shape-md); box-shadow: inset 0 0 0 1px var(--ybm-color-stroke-neutral-muted); font-size: var(--ybm-font-size-t03); cursor: grab; }
  .tp-layer { display: flex; align-items: center; gap: var(--ybm-space-x2); min-height: 36px; padding: 0 var(--ybm-space-x2); border-radius: var(--ybm-shape-sm); font-size: var(--ybm-font-size-t03); }
  .tp-layer[aria-selected="true"] { background: var(--ybm-color-bg-brand-weak); color: var(--ybm-color-fg-brand); }
  .tp-layer .tp-grow { flex: 1 1 auto; }
  .tp-canvas { flex: 1 1 auto; overflow: auto; padding: var(--ybm-space-x8) var(--ybm-space-x6); background: var(--ybm-color-bg-neutral-subtle); }
  .tp-page { display: flex; flex-direction: column; gap: var(--ybm-space-x4); width: min(100%, 880px); margin-inline: auto; padding: var(--ybm-space-x6); border-radius: var(--ybm-shape-lg); background: var(--ybm-color-bg-layer-default); box-shadow: 0 4px 24px rgb(0 0 0 / .08); }
  .tp-picked { outline: 2px solid var(--ybm-color-stroke-brand-solid); outline-offset: 4px; border-radius: var(--ybm-shape-sm); }
</style>
</head>
<body>
<div class="tp-tool">
<header class="tp-tool__bar"><h1 class="tp-h4">페이지 편집기</h1><span class="tp-spacer"></span><div class="ds-segmented" role="group" aria-label="화면 크기" data-size="medium"><button type="button" class="ds-segmented__item" aria-pressed="true"><i class="ds-icon ds-icon--monitor ds-icon--sm" aria-hidden="true"></i></button><button type="button" class="ds-segmented__item" aria-pressed="false"><i class="ds-icon ds-icon--panel-right ds-icon--sm" aria-hidden="true"></i></button><button type="button" class="ds-segmented__item" aria-pressed="false"><i class="ds-icon ds-icon--smartphone ds-icon--sm" aria-hidden="true"></i></button></div><button type="button" class="ds-btn" data-variant="ghost" data-size="medium" data-layout="iconOnly" aria-label="되돌리기"><i class="ds-icon ds-icon--undo-2" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="medium" data-layout="iconOnly" aria-label="다시 하기"><i class="ds-icon ds-icon--redo-2" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="neutralWeak" data-size="medium"><i class="ds-icon ds-icon--eye" aria-hidden="true"></i>미리 보기</button><button type="button" class="ds-btn" data-variant="brandSolid" data-size="medium">게시</button></header>
<div class="tp-tool__body">
  <aside class="tp-pane tp-pane--left" aria-label="블록과 레이어"><div class="ds-tabs" role="tablist" aria-label="왼쪽 패널"><button type="button" class="ds-tabs__trigger" role="tab" aria-selected="true">블록</button><button type="button" class="ds-tabs__trigger" role="tab" aria-selected="false">설정</button></div><span class="tp-label">블록 넣기</span><ul class="tp-blocks"><li draggable="true"><i class="ds-icon ds-icon--type ds-icon--sm" aria-hidden="true"></i>제목</li><li draggable="true"><i class="ds-icon ds-icon--text-align-start ds-icon--sm" aria-hidden="true"></i>글</li><li draggable="true"><i class="ds-icon ds-icon--image ds-icon--sm" aria-hidden="true"></i>이미지</li><li draggable="true"><i class="ds-icon ds-icon--square ds-icon--sm" aria-hidden="true"></i>버튼</li><li draggable="true"><i class="ds-icon ds-icon--layout-grid ds-icon--sm" aria-hidden="true"></i>카드 묶음</li><li draggable="true"><i class="ds-icon ds-icon--list ds-icon--sm" aria-hidden="true"></i>표</li><li draggable="true"><i class="ds-icon ds-icon--chart-line ds-icon--sm" aria-hidden="true"></i>그래프</li><li draggable="true"><i class="ds-icon ds-icon--minus ds-icon--sm" aria-hidden="true"></i>구분선</li></ul><span class="tp-label">레이어</span><div><div class="tp-layer"><i class="ds-icon ds-icon--grip-vertical ds-icon--sm" aria-hidden="true"></i><span class="tp-grow">머리글</span><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="머리글 위로"><i class="ds-icon ds-icon--arrow-up" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="머리글 아래로"><i class="ds-icon ds-icon--arrow-down" aria-hidden="true"></i></button></div><div class="tp-layer"><i class="ds-icon ds-icon--grip-vertical ds-icon--sm" aria-hidden="true"></i><span class="tp-grow">요약 카드</span><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="요약 카드 위로"><i class="ds-icon ds-icon--arrow-up" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="요약 카드 아래로"><i class="ds-icon ds-icon--arrow-down" aria-hidden="true"></i></button></div><div class="tp-layer" aria-selected="true"><i class="ds-icon ds-icon--grip-vertical ds-icon--sm" aria-hidden="true"></i><span class="tp-grow">최근 결제 표</span><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="최근 결제 표 위로"><i class="ds-icon ds-icon--arrow-up" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="최근 결제 표 아래로"><i class="ds-icon ds-icon--arrow-down" aria-hidden="true"></i></button></div><div class="tp-layer"><i class="ds-icon ds-icon--grip-vertical ds-icon--sm" aria-hidden="true"></i><span class="tp-grow">바닥글</span><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="바닥글 위로"><i class="ds-icon ds-icon--arrow-up" aria-hidden="true"></i></button><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="바닥글 아래로"><i class="ds-icon ds-icon--arrow-down" aria-hidden="true"></i></button></div></div></aside>
  <main class="tp-pane tp-pane--main"><div class="tp-canvas"><div class="tp-page">
    <div class="tp-between"><span class="tp-h2">내 가계부</span><button type="button" class="ds-btn" data-variant="neutralWeak" data-size="small"><i class="ds-icon ds-icon--download" aria-hidden="true"></i>내보내기</button></div>
    <div class="tp-g3"><section class="ds-card tp-card" data-size="small"><div class="tp-stack"><span class="tp-kpi__label">이번 달 수입</span><div class="tp-row" style="align-items: baseline; flex-wrap: wrap"><span class="tp-kpi__value">320만원</span></div></div></section><section class="ds-card tp-card" data-size="small"><div class="tp-stack"><span class="tp-kpi__label">이번 달 지출</span><div class="tp-row" style="align-items: baseline; flex-wrap: wrap"><span class="tp-kpi__value">158만원</span></div></div></section><section class="ds-card tp-card" data-size="small"><div class="tp-stack"><span class="tp-kpi__label">남은 예산</span><div class="tp-row" style="align-items: baseline; flex-wrap: wrap"><span class="tp-kpi__value">42만원</span></div></div></section></div>
    <div class="tp-picked"><section class="ds-card tp-card" data-size="small"><div class="tp-between"><div class="tp-stack"><h3 class="tp-h3">최근 결제</h3><span class="tp-sub">최근 계좌 활동이에요.</span></div><button type="button" class="ds-btn" data-variant="neutralWeak" data-size="small">전체 보기</button></div><div class="ds-table-wrap"><table class="ds-table" data-density="compact"><thead><tr><th scope="col">내역</th><th scope="col">분류</th><th scope="col">날짜</th><th scope="col" data-align="end">금액</th></tr></thead><tbody><tr><td>가 카페</td><td><span class="ds-badge" data-tone="neutral">음식</span></td><td><span class="tp-num">오늘</span></td><td data-align="end"><span class="tp-num">-6,500원</span></td></tr><tr><td>나 서점</td><td><span class="ds-badge" data-tone="neutral">교육</span></td><td><span class="tp-num">어제</span></td><td data-align="end"><span class="tp-num">-24,000원</span></td></tr><tr><td>월급</td><td><span class="ds-badge" data-tone="neutral">수입</span></td><td><span class="tp-num">10.25</span></td><td data-align="end"><span class="tp-num">+3,200,000원</span></td></tr><tr><td>다 마트</td><td><span class="ds-badge" data-tone="neutral">생활</span></td><td><span class="tp-num">10.24</span></td><td data-align="end"><span class="tp-num">-58,200원</span></td></tr><tr><td>라 주유소</td><td><span class="ds-badge" data-tone="neutral">교통</span></td><td><span class="tp-num">10.23</span></td><td data-align="end"><span class="tp-num">-70,000원</span></td></tr></tbody></table></div></section></div>
  </div></div></main>
  <aside class="tp-pane tp-pane--right" aria-label="속성"><div class="tp-between"><span class="tp-h4">최근 결제 표</span><button type="button" class="ds-btn" data-variant="ghost" data-size="xsmall" data-layout="iconOnly" aria-label="블록 지우기"><i class="ds-icon ds-icon--trash" aria-hidden="true"></i></button></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="pe-t">제목</label></div><div class="ds-input" data-variant="outline" data-size="medium"><input class="ds-input__control" id="pe-t" value="최근 결제" aria-label="제목" ></div></div><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="pe-n">보여 줄 행 수</label></div><button type="button" class="ds-select" data-size="medium" id="pe-n" aria-haspopup="listbox" aria-expanded="false"><span class="ds-select__value">5개</span></button></div><label class="tp-between"><span class="tp-sub">전체 보기 버튼</span><label class="ds-switch"><input type="checkbox" role="switch" class="ds-switch__control" aria-label="전체 보기 버튼" checked></label></label><label class="tp-between"><span class="tp-sub">분류 배지</span><label class="ds-switch"><input type="checkbox" role="switch" class="ds-switch__control" aria-label="분류 배지" checked></label></label><div class="ds-field"><div class="ds-field__header"><label class="ds-field__label" for="pe-pad">안쪽 여백</label></div><div class="ds-segmented" role="group" aria-label="안쪽 여백" data-size="small"><button type="button" class="ds-segmented__item" aria-pressed="false">좁게</button><button type="button" class="ds-segmented__item" aria-pressed="true">보통</button><button type="button" class="ds-segmented__item" aria-pressed="false">넓게</button></div></div></aside>
</div>
</div>
</body>
</html>
